pluginManagement {
	mod_id

	repositories {
		maven {
			name = "Fabric"
			url = "https://maven.fabricmc.net/"
		}

		gradlePluginPortal()
		mavenCentral()
	}

	plugins {
		id "org.jetbrains.kotlin.jvm" version kotlin_version
		id "com.gradleup.shadow" version shadow_version
	}
}

rootProject.name = mod_id
